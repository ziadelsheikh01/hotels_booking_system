services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: "jdbc:mysql://db:3306/booking_system_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
       db:
         condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: hotel-db
    environment:
      MYSQL_DATABASE: booking_system_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hotel-network
    restart: unless-stopped

networks:
   hotel-network:
      driver: bridge

volumes:
  mysql-data:
